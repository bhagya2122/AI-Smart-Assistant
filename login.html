<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AI Smart Safety Assistant</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #10172a, #173b63, #421b60);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            color: white;
        }

        .icon {
            font-size: 55px;
            text-align: center;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #d0d7e8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #596781;
            border-radius: 9px;
            background: #f7f9ff;
            color: #172033;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #66d9ef;
            box-shadow: 0 0 5px #66d9ef;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(90deg, #00c6ff, #7b61ff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            color: #ffb3b3;
            font-size: 14px;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #e0e7ff;
        }

        a {
            color: #66e3ff;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="icon">🤖</div>

        <h1>Welcome Back!</h1>

        <p class="subtitle">
            AI Smart Safety & Emotion Assistant
        </p>

        <form action="{{ url_for('login') }}" method="POST">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Login Securely 🔐</button>

        </form>

        {% if error %}
            <div class="message">{{ error }}</div>
        {% endif %}

        <div class="register-link">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create Account</a>
        </div>

    </div>

</body>
</html>
